{% extends "records/base.html" %}
{% block page_title %}无访问权限{% endblock %}
{% block content %}
<div class="state state--warn">
    <div class="state__icon">🔒</div>
    <h2 class="state__title">抱歉，您没有访问该内容的权限</h2>
    <p class="state__desc">当前账号未被授予所需权限。如需开通，请联系系统管理员分配相应角色。</p>
    <div class="state__actions">
        <a class="btn-transparent btn-sm" href="/">返回首页</a>
        <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="btn-transparent btn-sm">退出登录</button>
        </form>
    </div>
</div>
{% endblock %}
