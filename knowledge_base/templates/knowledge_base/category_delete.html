{% extends 'knowledge_base/base.html' %}

{% block knowledge_content %}
<div class="card border-danger">
    <div class="card-header bg-danger text-white">
        <h4>确认删除分类</h4>
    </div>
    <div class="card-body">
        <p class="alert alert-warning">
            <i class="fas fa-exclamation-triangle"></i> 确定要删除分类「{{ category.name }}」吗？
        </p>
        {% if document_count > 0 %}
        <p class="text-danger">此分类下有 <strong>{{ document_count }}</strong> 篇文档，删除后这些文档的分类将变为空。</p>
        {% endif %}
        <p class="text-muted">此操作无法撤销。</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">确认删除</button>
                <a href="{% url 'knowledge_base:category_list' %}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
