{% extends 'knowledge_base/base.html' %}

{% block knowledge_content %}
<div class="card border-danger">
    <div class="card-header bg-danger text-white">
        <h4>确认删除</h4>
    </div>
    <div class="card-body">
        <p class="alert alert-warning">
            <i class="fas fa-exclamation-triangle"></i> 确定要删除文档「{{ document.title }}」吗？
        </p>
        <p class="text-muted">此操作无法撤销。</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">确认删除</button>
                <a href="{% url 'knowledge_base:document_detail' document.pk %}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
