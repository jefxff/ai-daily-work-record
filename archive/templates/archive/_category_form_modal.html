<form method="POST" data-modal-form action="{{ request.path }}" novalidate>
    {% csrf_token %}
    <div class="arc-form-grid">
        {% for field in form.visible_fields %}
        <div class="arc-field">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span style="color:var(--c-danger)">*</span>{% endif %}</label>
            {{ field }}
            {% for error in field.errors %}<div class="arc-error">{{ error }}</div>{% endfor %}
        </div>
        {% endfor %}
    </div>
    {% if form.non_field_errors %}
    <div class="arc-error" style="margin-bottom:0.75rem;">
        {% for error in form.non_field_errors %}<div>{{ error }}</div>{% endfor %}
    </div>
    {% endif %}
    <div class="form-modal-actions">
        <button type="button" class="btn-transparent" data-modal-close>取消</button>
        <button type="submit" class="btn-transparent btn-delete" data-modal-save>{% if mode == 'edit' %}保存{% else %}创建{% endif %}</button>
    </div>
</form>

<style>
    .arc-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem 1rem; }
    @media (max-width: 560px) { .arc-form-grid { grid-template-columns: 1fr; } }
    .arc-field label { display:block; font-weight:600; color:var(--c-text); font-size:0.85rem; margin-bottom:0.25rem; }
    .arc-field .form-control, .arc-field .form-select { width:100%; padding:0.45rem 0.6rem; font-size:0.88rem; border:1px solid var(--c-border-strong); border-radius:4px; background:var(--c-surface); color:var(--c-text); }
    .arc-field .form-control:focus, .arc-field .form-select:focus { border-color:var(--c-primary); box-shadow:0 0 0 2px var(--c-primary-ring); outline:none; }
    .arc-error { color:var(--c-danger); font-size:0.8rem; margin-top:0.25rem; }
</style>
