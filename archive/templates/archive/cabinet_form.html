{% extends "records/base.html" %}
{% block page_title %}{% if mode == 'edit' %}编辑{% else %}新建{% endif %}档案柜{% endblock %}
{% block content %}
<div class="form-container">
    <div class="form-head">
        <div>
            <h1 class="form-title" data-kicker="ARCHIVE / 档案柜">{% if mode == 'edit' %}编辑{% else %}新建{% endif %}档案柜</h1>
            <p class="form-subtitle">设置柜体位置与各层格数，层格变动会同步到存放视图。</p>
        </div>
        <a class="form-back" href="{{ cancel_url }}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            返回
        </a>
    </div>
    {% include "archive/_cabinet_form_modal.html" %}
</div>
{% endblock %}
