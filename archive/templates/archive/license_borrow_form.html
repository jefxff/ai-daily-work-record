{% extends "records/base.html" %}
{% block page_title %}证照借阅登记{% endblock %}
{% block content %}
<div class="form-container">
    <div class="form-head">
        <div>
            <h1 class="form-title" data-kicker="LICENSE / 证照借阅">证照借阅登记</h1>
            <p class="form-subtitle">{{ license.name }}{% if license.number %} · {{ license.number }}{% endif %}，登记借阅人与预计归还日期。</p>
        </div>
        <a class="form-back" href="{{ cancel_url }}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            返回
        </a>
    </div>
    {% include "archive/_license_borrow_modal.html" %}
</div>
{% endblock %}
