{% extends "records/base.html" %}
{% block page_title %}{% if mode == 'edit' %}编辑{% else %}录入{% endif %}证照{% endblock %}
{% block content %}
<div class="form-container">
    <div class="form-head">
        <div>
            <h1 class="form-title">{% if mode == 'edit' %}编辑{% else %}录入{% endif %}证照</h1>
            <p class="form-subtitle">证照到期与年审时间会进入到期预警，请按实际有效期填写。</p>
        </div>
        <a class="form-back" href="{{ cancel_url }}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            返回证照列表
        </a>
    </div>
    {% include "archive/_license_form_modal.html" %}
</div>
{% endblock %}
