name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    env:
      # 注意：HTTPS 相关开关只能挂在「check --deploy」单步上（见该步骤 env）。
      # 若放在 job 级，SECURE_SSL_REDIRECT 会让测试客户端的每次 GET 变成 301，
      # 造成整批测试假红（本地已复现：301 != 200）。
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_DEBUG: "0"
    steps:
      # Action 固定到 40 位 commit SHA：浮动 tag 可被上游重写，属于供应链投毒入口
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装质量与安全工具
        run: pip install -r requirements-dev.txt

      - name: 依赖完整性
        run: python -m pip check
      # 审查 C3：requirements.txt 改了却忘记重新生成 requirements.lock 会造成
      # 「开发装新版、部署按锁装旧版」的静默漂移，这里直接让 CI 变红。
      - name: 依赖锁一致性（阻断）
        run: python scripts/check_lock_sync.py


      # 审计 SEC-01：防止硬编码 SECRET_KEY / Token / 私钥再次进入仓库
      - name: 密钥泄漏扫描
        run: python scripts/check_secrets.py

      - name: Django 系统检查
        run: python manage.py check

      # 本项目按「内网 HTTP 单机」部署，HSTS / SSL 重定向 / 安全 Cookie 有意关闭
      # （security.W004/W008/W012/W016 为已知项），因此该检查只做留痕不阻断。
      - name: 生产形态检查（HTTP 内网部署，安全项为已知收敛项）
                # HTTPS 开关只对本步骤生效：模拟「已前置 HTTPS 反代」的生产形态
        env:
          DJANGO_HTTPS_ONLY: "1"
          DJANGO_BEHIND_HTTPS_PROXY: "1"
          DJANGO_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy --fail-level WARNING

      - name: 迁移文件一致性
        run: python manage.py makemigrations --check --dry-run

      # 审查 H4：DEBUG=0 下 /static/ 由 STATIC_ROOT 提供，collectstatic 必须真能产出
      # 内容；产物为空会让内网用户看到「无样式页面」，而单元测试发现不了。
      - name: 静态资源可收集（阻断）
        run: |
          python manage.py collectstatic --noinput --clear > /dev/null
          test -n "$(ls -A staticfiles)" || { echo "::error::collectstatic 未产出任何文件"; exit 1; }

      - name: Python 语法与未定义名称（ruff 规则由 pyproject.toml 统一）
        run: python -m ruff check .

      - name: 安全扫描（中危及以上）
        run: python -m bandit -r . -ll -x ./tests,./migrations,./.git,./tests/visual,./scripts -q

      # 审计 SUP-01：审计结果必须留在 Job Summary，而不是只打印后随日志滚走。
      # 门禁阻断：确有已知漏洞时 CI 必须红；如属已评估接受的风险，
      # 在仓库变量 PIP_AUDIT_IGNORE 中以逗号分隔填写漏洞 ID 豁免。
      - name: 依赖漏洞审计（阻断）
        run: |
          set -euo pipefail
          IGNORE_ARGS=""
          if [ -n "${PIP_AUDIT_IGNORE:-}" ]; then
            IFS=',' read -ra IDS <<< "$PIP_AUDIT_IGNORE"
            for id in "${IDS[@]}"; do IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $id"; done
          fi
          python -m pip_audit -r requirements.txt --strict --desc $IGNORE_ARGS 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 生成 SBOM（CycloneDX）
        run: |
          python scripts/gen_sbom.py sbom.cdx.json
          echo "SBOM 组件数：$(python -c "import json;print(len(json.load(open('sbom.cdx.json'))['components']))")" >> "$GITHUB_STEP_SUMMARY"

      - name: 运行测试并统计覆盖率
        run: |
          set +e
          python -m coverage run manage.py test > test.log 2>&1
          code=$?
          cat test.log
          if [ "$code" -ne 0 ]; then
            {
              echo "### 测试失败摘要"
              echo '```'
              grep -E "^(FAIL|ERROR):|^Ran |^FAILED|AssertionError|Error: " test.log | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 同时以注解形式暴露（公开仓库的 annotations API 可匿名读取，便于排障）
            echo "::error::FAILED_TESTS: $(grep -E '^(FAIL|ERROR):' test.log | sed -E 's/ \(.*//' | tr '\n' ';' | head -c 3500)"
            echo "::error::TAIL: $(grep -E -A 12 '^(FAIL|ERROR):' test.log | tr '\n' '~' | head -c 3500)"
          fi
          python -m coverage report -m
          exit $code

      # 审计 SUP-02：覆盖率闸门。本地实测基线 79%（18125 行语句，3807 行未覆盖），
      # 阈值取 70% 留出波动余量后转为阻断。
      - name: 覆盖率闸门（阻断）
        run: python -m coverage report --fail-under=70

  visual-a11y:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      CI_A11Y_ONLY: "1"
      BASE_URL: "http://127.0.0.1:8080"
      DJANGO_SUPERUSER_PASSWORD: "CiVisual#2026"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: 准备数据库与登录态
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py createsuperuser --noinput --username ci_visual --email ci@example.com
          python scripts/gen_visual_auth.py

      - name: 启动 Django
        run: |
          python manage.py runserver 127.0.0.1:8080 --noreload > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/accounts/login/ >/dev/null && exit 0
            sleep 2
          done
          cat server.log
          exit 1

      # 拆成三个步骤：npm 安装 / 浏览器安装 / 断言，失败时能直接看出卡在哪一环
      - name: 安装 Playwright 依赖（npm ci）
        run: |
          cd tests/visual
          npm ci

      - name: 安装 Firefox 浏览器
        run: |
          cd tests/visual
          npx playwright install --with-deps firefox

      - name: 运行 a11y/移动端断言
        run: |
          cd tests/visual
          set +e
          npx playwright test > pw.log 2>&1
          code=$?
          tail -120 pw.log
          if [ "$code" -ne 0 ]; then
            {
              echo "### Playwright 失败摘要"
              echo '```'
              grep -E "Error:|expect|failed|✘|Timed out" pw.log | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::PW_FAILED: $(grep -E '^\s+[0-9]+\) |Error: |Timeout' pw.log | tr '\n' '~' | head -c 3500)"
            echo "::error::PW_TAIL: $(tail -c 2500 pw.log | tr '\n' '~')"
          fi
          exit $code
