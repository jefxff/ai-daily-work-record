name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    env:
      # 生产形态的安全检查：HTTPS 相关开关打开后才做 check --deploy
      DJANGO_HTTPS_ONLY: "1"
      DJANGO_BEHIND_HTTPS_PROXY: "1"
      DJANGO_HSTS_SECONDS: "31536000"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_DEBUG: "0"
    steps:
      # Action 固定到 40 位 commit SHA：浮动 tag 可被上游重写，属于供应链投毒入口
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装质量与安全工具
        run: pip install -r requirements-dev.txt

      - name: 依赖完整性
        run: python -m pip check

      # 审计 SEC-01：防止硬编码 SECRET_KEY / Token / 私钥再次进入仓库
      - name: 密钥泄漏扫描
        run: python scripts/check_secrets.py

      - name: Django 系统检查
        run: python manage.py check

      # 本项目按「内网 HTTP 单机」部署，HSTS / SSL 重定向 / 安全 Cookie 有意关闭
      # （security.W004/W008/W012/W016 为已知项），因此该检查只做留痕不阻断。
      - name: 生产形态检查（HTTP 内网部署，安全项为已知收敛项）
        continue-on-error: true
        run: python manage.py check --deploy --fail-level WARNING

      - name: 迁移文件一致性
        run: python manage.py makemigrations --check --dry-run

      - name: Python 语法与未定义名称
        run: python -m ruff check . --select E9,F63,F7,F82

      - name: 安全扫描（高危）
        run: python -m bandit -r . -lll -x ./tests,./migrations,./.git -q

      # 审计 SUP-01：审计结果必须留在 Job Summary，而不是只打印后随日志滚走
      - name: 依赖漏洞审计（发现上游未修复项时不阻断）
        continue-on-error: true
        run: |
          python -m pip_audit -r requirements.txt --strict --format json --output pip-audit.json || true
          python -m pip_audit -r requirements.txt --strict --desc 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: 生成 SBOM（CycloneDX）
        run: |
          python scripts/gen_sbom.py sbom.cdx.json
          echo "SBOM 组件数：$(python -c "import json;print(len(json.load(open('sbom.cdx.json'))['components']))")" >> "$GITHUB_STEP_SUMMARY"

      - name: 运行测试并统计覆盖率
        run: |
          python -m coverage run manage.py test
          python -m coverage report -m

      # 审计 SUP-02：覆盖率闸门。阈值 60% 先以「不阻断」方式跑一轮，等 CI 首次
      # 实测值留痕后改为阻断（本地环境离线装不上 coverage，无法预先标定基准）。
      - name: 覆盖率闸门（首轮实测后转为阻断）
        continue-on-error: true
        run: python -m coverage report --fail-under=60

  visual-a11y:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      CI_A11Y_ONLY: "1"
      BASE_URL: "http://127.0.0.1:8080"
      DJANGO_SUPERUSER_PASSWORD: "CiVisual#2026"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: 准备数据库与登录态
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py createsuperuser --noinput --username ci_visual --email ci@example.com
          python scripts/gen_visual_auth.py

      - name: 启动 Django
        run: |
          python manage.py runserver 127.0.0.1:8080 --noreload > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/accounts/login/ >/dev/null && exit 0
            sleep 2
          done
          cat server.log
          exit 1

      - name: 安装 Playwright 并运行 a11y/移动端断言
        run: |
          cd tests/visual
          npm ci
          npx playwright install --with-deps firefox
          npx playwright test
