version: "3.9"

services:
  web:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - archive-media:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=work_record.settings
    depends_on:
      - redis
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8080"

  # Celery 异步任务（批量导入/大文件处理预留）
  celery_worker:
    build: .
    volumes:
      - .:/app
      - archive-media:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=work_record.settings
    depends_on:
      - redis
    command: celery -A work_record worker -l info

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  archive-media:
