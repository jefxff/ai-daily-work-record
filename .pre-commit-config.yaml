# 提交前密钥扫描：阻止 SECRET_KEY / Token / 私钥再次进入仓库（审计 BE-09）
# 使用方式：pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # 代码质量：ruff 规则由 pyproject.toml 统一（审计 META-03）。
  # ruff-format 会重写文件，先保持不启用，避免与既有代码风格产生大面积 diff。
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
