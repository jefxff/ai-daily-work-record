{% load static %}
<button type="button" class="copilot-fab" id="copilotFab" hidden
        aria-label="打开 AI 助手" title="AI 助手（Ctrl+K）">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
</button>

<section class="copilot-panel" id="copilotPanel" hidden role="dialog" aria-modal="false"
         aria-label="AI 助手">
    <header class="copilot-header">
        <div class="copilot-title">
            <span class="copilot-grip" aria-hidden="true">
                <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor">
                    <circle cx="2" cy="2" r="1.5"/><circle cx="8" cy="2" r="1.5"/>
                    <circle cx="2" cy="7" r="1.5"/><circle cx="8" cy="7" r="1.5"/>
                    <circle cx="2" cy="12" r="1.5"/><circle cx="8" cy="12" r="1.5"/>
                </svg>
            </span>
            AI 助手
            <span class="copilot-badge" id="copilotBadge" hidden></span>
        </div>
        <div class="copilot-header-actions">
            <button type="button" class="copilot-iconbtn copilot-pin" id="copilotPin"
                    title="钉住位置（拖动标题栏可移动，双击标题栏复位）"
                    aria-label="钉住位置" aria-pressed="false">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 17v5"/>
                    <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/>
                </svg>
            </button>
            <button type="button" class="copilot-iconbtn" id="copilotNew"
                    title="新对话" aria-label="新对话">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
            </button>
            <button type="button" class="copilot-iconbtn copilot-close" id="copilotClose"
                    title="关闭" aria-label="关闭">&times;</button>
        </div>
    </header>

    <div class="copilot-log" id="copilotLog" aria-live="polite"></div>

    <div class="copilot-examples" id="copilotExamples"></div>

    <form class="copilot-form" id="copilotForm" autocomplete="off">
        <label class="copilot-sr" for="copilotInput">提问</label>
        <textarea id="copilotInput" rows="2" maxlength="500"
                  placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button type="submit" class="copilot-send" id="copilotSend">发送</button>
    </form>

    <div class="copilot-hint" id="copilotHint" role="status"></div>
</section>

<script src="{% static 'copilot/panel.js' %}?v=20261031n" defer></script>
