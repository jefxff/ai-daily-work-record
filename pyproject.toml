[project]
name = "ai-daily-work-record"
version = "2.0.0"
description = "每日工作记录管理系统（Django + Bootstrap，内网单机部署）"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# 与 CI 当前门禁保持一致（E9/F63/F7/F82）。扩大规则集需先清理存量告警，另行排期。
select = ["E9", "F63", "F7", "F82"]
