[project]
name = "ai-daily-work-record"
version = "2.0.0"
description = "每日工作记录管理系统（Django + Bootstrap，内网单机部署）"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# 门禁规则：语法错误 + 未定义/重复定义名称（可在本地一条命令复现）。
# 扩大风格类规则需先清理存量告警，另行排期。
select = ["E9", "F63", "F7", "F82", "F811", "F821", "F823"]
exclude = ["migrations", "tests/visual/node_modules"]
