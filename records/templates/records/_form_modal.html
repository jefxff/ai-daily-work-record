{% load static %}
<form method="post" data-modal-form action="{{ request.path }}">
    {% csrf_token %}

    {% if form.non_field_errors %}
    <div class="alert alert-danger">{{ form.non_field_errors }}</div>
    {% endif %}

    {{ form.as_p }}

    <div class="form-modal-actions">
        <button type="button" class="btn-transparent" data-modal-close>取消</button>
        <button type="submit" class="btn-transparent btn-delete" data-modal-save>{{ save_label|default:"保存" }}</button>
    </div>
</form>

<style>
    /* 局部表单样式微调（在弹窗内） */
    #formModalBody form p { margin-bottom: 1rem; }
    #formModalBody form p label { display: block; font-weight: 600; color: var(--c-text); margin-bottom: 0.25rem; font-size: 0.9rem; }
    #formModalBody form p input[type="text"],
    #formModalBody form p input[type="number"],
    #formModalBody form p input[type="date"],
    #formModalBody form p input[type="datetime-local"],
    #formModalBody form p input[type="email"],
    #formModalBody form p input[type="tel"],
    #formModalBody form p input[type="password"],
    #formModalBody form p select,
    #formModalBody form p textarea {
        display: block; width: 100%; padding: 0.5rem 0.625rem; font-size: 0.9rem;
        border: 1px solid var(--c-border-strong); border-radius: 4px; background: var(--c-surface); color: var(--c-text);
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    #formModalBody form p input:focus,
    #formModalBody form p select:focus,
    #formModalBody form p textarea:focus {
        border-color: var(--c-primary); box-shadow: 0 0 0 2px var(--c-primary-ring); outline: none;
    }
    #formModalBody form p .errorlist,
    #formModalBody form p .errorlist li {
        color: var(--c-danger); font-size: 0.8rem; margin-top: 0.25rem; list-style: none; padding: 0;
    }
    #formModalBody form p .help-text,
    #formModalBody form p .helptext {
        color: var(--c-text-secondary); font-size: 0.8rem; margin-top: 0.25rem; display: block;
    }
</style>
