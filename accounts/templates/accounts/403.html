{% extends "records/base.html" %}

{% block page_title %}无访问权限 - 每日工作记录{% endblock %}

{% block content %}
<div style="background:var(--c-surface); border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.08); padding:3rem 2rem; text-align:center; max-width:560px; margin:3rem auto;">
    <div style="font-size:3.5rem; margin-bottom:0.75rem;">🔒</div>
    <h2 style="font-size:1.2rem; font-weight:600; color:var(--c-text); margin-bottom:0.5rem;">抱歉，您没有访问该内容的权限</h2>
    <p style="color:var(--c-text-secondary); font-size:0.9rem; margin-bottom:1.5rem;">
        当前账号未被授予所需权限，如需开通请联系系统管理员分配相应角色。
    </p>
    <div style="display:flex; gap:0.75rem; justify-content:center;">
        <a class="btn-transparent btn-sm" href="/">返回首页</a>
        <form class="u-inline" method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn-transparent btn-sm" style="border:none; cursor:pointer;">退出登录</button>
        </form>
    </div>
</div>
{% endblock %}
