{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block auth_title %}登录 - 每日工作记录{% endblock %}</title>
    <link rel="icon" href="{% static 'img/favicon.ico' %}">
    <link href="{% static 'css/bootstrap.min.css' %}?v=5.3" rel="stylesheet">
    <!-- 设计令牌（登录页是独立外壳，必须单独引入，否则 var(--) 全部失效） -->
    <link href="{% static 'css/tokens.css' %}?v=20261022b" rel="stylesheet">
    <style>
        body { font-family: var(--font-body); background: var(--c-bg); min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .auth-brand .auth-brand-title, .auth-card h1, .auth-card h2 { font-family: var(--font-display); }
        .auth-shell { width: 100%; max-width: 420px; }
        .auth-brand { text-align: center; margin-bottom: 1.5rem; }
        .auth-brand .brand-logo { width: 48px; height: 48px; background: var(--c-primary); border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 0.75rem; }
        .auth-brand .auth-brand-title { font-size: 1.25rem; font-weight: 600; color: var(--c-text); margin: 0 0 4px; }
        .auth-brand p { font-size: 0.85rem; color: var(--c-text-secondary); margin: 0; }
        .auth-card { background: var(--c-surface); border-radius: 8px; box-shadow: var(--sh-card); padding: 2rem; }
        .auth-card h1, .auth-card h2 { font-size: 1.15rem; font-weight: 600; color: var(--c-text); margin: 0 0 1.25rem; }
        .form-label { font-size: 0.875rem; color: var(--c-text-secondary); font-weight: 500; }
        .form-control { border-radius: 6px; border-color: var(--c-border-strong); font-size: 0.9rem; padding: 0.55rem 0.75rem; }
        .form-control:focus { border-color: var(--c-primary); box-shadow: 0 0 0 2px var(--c-primary-ring); }
        .btn-primary { background: var(--c-primary); border-color: var(--c-primary); border-radius: 6px; padding: 0.6rem; font-weight: 500; width: 100%; }
        .btn-primary:hover { background: var(--c-primary-hover); border-color: var(--c-primary-hover); }
        .btn-secondary { background: var(--c-surface); border: 1px solid var(--c-border-strong); color: var(--c-text-secondary); border-radius: 6px; padding: 0.5rem 1rem; font-weight: 500; text-decoration: none; }
        .btn-secondary:hover { color: var(--c-primary); border-color: var(--c-border-hover); background: var(--c-surface); }
        .auth-alert { border-radius: 6px; font-size: 0.85rem; padding: 0.6rem 0.85rem; margin-bottom: 1rem; }
        .auth-alert-error { background: var(--c-danger-bg); border: 1px solid var(--c-danger-line); color: var(--c-danger); }
        .auth-alert-success { background: var(--c-success-bg); border: 1px solid var(--c-success-line); color: var(--c-success); }
        .auth-footer { text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: var(--c-text-secondary); }
        .auth-footer a { color: var(--c-primary); text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        .auth-foot-actions { display: flex; gap: 0.75rem; margin-top: 1rem; }
        .auth-foot-actions > * { flex: 1; text-align: center; }
        .forbidden-icon { font-size: 3rem; text-align: center; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-brand">
            <div class="brand-logo">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--c-text-inverse)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </div>
            <p class="auth-brand-title">每日工作记录管理系统</p>
            <p>试样跟进 · 业务台账 · 知识管理</p>
        </div>
        <div class="auth-card">
            {% block auth_content %}{% endblock %}
        </div>
        {% block auth_outside %}{% endblock %}
    </div>
</body>
</html>
